name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  CLOUD_RUN_REGION: us-central1
  CLOUD_RUN_SERVICE: order-api
  DB_DRIVER: org.postgresql.Driver

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'staging'))
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'staging' && 'staging' || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        env:
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
          INVENTORY_SERVICE_BASE_URL: ${{ secrets.INVENTORY_SERVICE_BASE_URL }}
          WALLET_SERVICE_BASE_URL: ${{ secrets.WALLET_SERVICE_BASE_URL }}
          VOUCHER_SERVICE_BASE_URL: ${{ secrets.VOUCHER_SERVICE_BASE_URL }}
        run: |
          trap 'rm -f deploy.env' EXIT
          default_db_url="jdbc:h2:mem:order;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"

          clean_env_value() {
            printf '%s' "${1:-}" | sed $'s/^\xEF\xBB\xBF//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          APP_CORS_ALLOWED_ORIGINS="$(clean_env_value "$APP_CORS_ALLOWED_ORIGINS")"
          CLOUD_SQL_INSTANCE_CONNECTION_NAME="$(clean_env_value "$CLOUD_SQL_INSTANCE_CONNECTION_NAME")"
          DB_URL="$(clean_env_value "$DB_URL")"
          DB_USERNAME="$(clean_env_value "$DB_USERNAME")"
          DB_PASSWORD="$(clean_env_value "$DB_PASSWORD")"
          INTERNAL_API_TOKEN="$(clean_env_value "$INTERNAL_API_TOKEN")"
          INVENTORY_SERVICE_BASE_URL="$(clean_env_value "$INVENTORY_SERVICE_BASE_URL")"
          WALLET_SERVICE_BASE_URL="$(clean_env_value "$WALLET_SERVICE_BASE_URL")"
          VOUCHER_SERVICE_BASE_URL="$(clean_env_value "$VOUCHER_SERVICE_BASE_URL")"

          cloud_sql_valid=false
          if [ -n "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:-}" ] &&
            [[ "$CLOUD_SQL_INSTANCE_CONNECTION_NAME" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]:[a-z0-9-]+:[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]]; then
            cloud_sql_valid=true
          fi

          db_url="${DB_URL:-$default_db_url}"
          if [[ "$db_url" == *"jdbc:"* && "$db_url" != jdbc:* ]]; then
            db_url="jdbc:${db_url#*jdbc:}"
          fi
          if [[ "$db_url" != jdbc:* ]]; then
            echo "::warning::DB_URL is not a JDBC URL; using demo H2 datasource."
            db_url="$default_db_url"
          fi
          if [[ "$db_url" == jdbc:postgresql:* && "$cloud_sql_valid" != "true" ]]; then
            echo "::warning::PostgreSQL DB_URL has no valid Cloud SQL attachment; using demo H2 datasource."
            db_url="$default_db_url"
          fi

          db_driver="$DB_DRIVER"
          if [[ "$db_url" == *"jdbc:h2:"* ]]; then
            db_driver="org.h2.Driver"
          fi

          INTERNAL_API_TOKEN="${INTERNAL_API_TOKEN:-json-internal-token}"
          INVENTORY_SERVICE_BASE_URL="${INVENTORY_SERVICE_BASE_URL:-https://inventory-api-osvihgaoya-uc.a.run.app}"
          WALLET_SERVICE_BASE_URL="${WALLET_SERVICE_BASE_URL:-https://wallet-api-osvihgaoya-uc.a.run.app}"
          VOUCHER_SERVICE_BASE_URL="${VOUCHER_SERVICE_BASE_URL:-https://voucher-promo-api-osvihgaoya-uc.a.run.app}"

          {
            printf 'APP_CORS_ALLOWED_ORIGINS=%s\n' "$APP_CORS_ALLOWED_ORIGINS"
            printf 'CLOUD_SQL_INSTANCE_CONNECTION_NAME=%s\n' "$CLOUD_SQL_INSTANCE_CONNECTION_NAME"
            printf 'DB_URL=%s\n' "$db_url"
            printf 'DB_DRIVER=%s\n' "$db_driver"
            printf 'DB_USERNAME=%s\n' "$DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'INTERNAL_API_TOKEN=%s\n' "$INTERNAL_API_TOKEN"
            printf 'INVENTORY_SERVICE_BASE_URL=%s\n' "$INVENTORY_SERVICE_BASE_URL"
            printf 'WALLET_SERVICE_BASE_URL=%s\n' "$WALLET_SERVICE_BASE_URL"
            printf 'VOUCHER_SERVICE_BASE_URL=%s\n' "$VOUCHER_SERVICE_BASE_URL"
          } > deploy.env

          cloud_sql_args=()
          if [ "$cloud_sql_valid" = "true" ]; then
            cloud_sql_args+=(--add-cloudsql-instances "$CLOUD_SQL_INSTANCE_CONNECTION_NAME")
          elif [ -n "${CLOUD_SQL_INSTANCE_CONNECTION_NAME:-}" ]; then
            echo "::warning::Skipping invalid CLOUD_SQL_INSTANCE_CONNECTION_NAME value."
          fi

          project_id="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT}}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$project_id" \
            --region "$CLOUD_RUN_REGION" \
            --allow-unauthenticated \
            --max-instances=3 \
            --env-vars-file deploy.env \
            "${cloud_sql_args[@]}"

      - name: Smoke test
        run: |
          project_id="${GOOGLE_CLOUD_PROJECT:-${CLOUDSDK_CORE_PROJECT}}"
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$project_id" \
            --region "$CLOUD_RUN_REGION" \
            --format='value(status.url)')"
          curl --fail --silent --show-error "$url/actuator/health"
