name: CD - Render Backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/cd-render-backend.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x ./gradlew
      - run: ./gradlew test --no-daemon

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Trigger Render Deploy Hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -fsSL "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"