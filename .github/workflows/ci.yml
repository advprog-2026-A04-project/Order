name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build, test, coverage gate, and package
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew check bootJar --no-daemon

      - name: Upload JaCoCo HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          if-no-files-found: warn
          path: |
            backend/build/test-results/test/**
            backend/build/reports/tests/test/**
            backend/build/reports/jacoco/test/**

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --fetch-timeout=120000 --fetch-retries=5

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
