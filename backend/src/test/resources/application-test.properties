spring.datasource.url=jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health,info
app.cors.allowed-origins=http://localhost:5173
app.jwt.secret=json-milestone-secret-json-milestone-secret
app.internal-token=json-internal-token
services.inventory.base-url=http://localhost:18082
services.wallet.base-url=http://localhost:18083
services.voucher.base-url=http://localhost:18084
